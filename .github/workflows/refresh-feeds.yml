name: Refresh reading feeds
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/update-feeds.py
      - .github/workflows/refresh-feeds.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh-reading-feeds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect RSS feeds
        run: python scripts/update-feeds.py
      - name: Save latest feed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/feeds.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh external reading feeds"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish updated page and feeds
        id: deployment
        uses: actions/deploy-pages@v4
