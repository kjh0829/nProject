name: Refresh stock returns
on:
  push:
    branches: [master]
    paths: ['scripts/update-stock-returns.py', '.github/workflows/refresh-stock-returns.yml']
  schedule:
    - cron: '23 10 3 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: stock-returns
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-stock-returns.py
      - name: Save public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stock-returns.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public historical stock return snapshot'
            git pull --rebase origin master
            git push origin master
          fi
      - name: Request Pages snapshot rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
