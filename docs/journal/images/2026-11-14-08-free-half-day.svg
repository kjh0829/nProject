<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">내 속도로 보내는 반나절</title><desc id="desc">산책, 집밥, 독서. 모두 할 필요 없이 한 가지만 선택해도 됩니다.</desc><rect width="900" height="560" rx="32" fill="#e8eddc"/><circle cx="760" cy="95" r="48" fill="#efc98b"/><g font-family="sans-serif" fill="#203e34"><text x="64" y="95" font-size="20">FIRE 생활 실험 · 01</text><text x="64" y="158" font-size="38" font-weight="bold">돈보다 내 취향으로 채우는 시간</text><path d="M180 310H720" stroke="#879b7d" stroke-width="5" stroke-dasharray="10 10"/><g fill="#fffdf6" stroke="#b8c5aa" stroke-width="2"><rect x="60" y="230" width="230" height="175" rx="24"/><rect x="335" y="230" width="230" height="175" rx="24"/><rect x="610" y="230" width="230" height="175" rx="24"/></g><g text-anchor="middle"><text x="175" y="300" font-size="32">산책</text><text x="175" y="350" font-size="20">가까운 길 한 바퀴</text><text x="450" y="300" font-size="32">집밥</text><text x="450" y="350" font-size="20">익숙한 메뉴 한 그릇</text><text x="725" y="300" font-size="32">독서</text><text x="725" y="350" font-size="20">궁금한 부분 하나</text><text x="450" y="470" font-size="25">셋 다 할 필요 없이, 한 가지만 골라도 좋아요.</text><text x="450" y="515" font-size="17">가상 생활 제안 · 식재료와 이동에는 비용이 들 수 있습니다.</text></g></g></svg>