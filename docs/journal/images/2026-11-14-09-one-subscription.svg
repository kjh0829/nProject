<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" role="img" aria-labelledby="title desc"><title id="title">구독 한 건, 세 가지 선택</title><desc id="desc">최근 사용 장면을 떠올리고 유지, 잠시 쉬기, 정리하기 중 하나를 고릅니다. 공식 결제 조건도 확인합니다.</desc><rect width="700" height="820" rx="30" fill="#e8eddc"/><g font-family="sans-serif" fill="#203e34"><text x="45" y="65" font-size="22">FIRE 소비 습관 · 02</text><text x="45" y="125" font-size="34" font-weight="bold">좋아하는 소비는 남겨 두세요</text><text x="45" y="190" font-size="26">구독 하나, 최근 언제 즐겁게 썼나요?</text><g fill="#fffdf6"><rect x="45" y="230" width="610" height="120" rx="20"/><rect x="45" y="375" width="610" height="120" rx="20"/><rect x="45" y="520" width="610" height="120" rx="20"/></g><text x="75" y="280" font-size="30">유지</text><text x="75" y="320" font-size="24">좋아할 시간이 있어요</text><text x="75" y="425" font-size="30">잠시 쉬기</text><text x="75" y="465" font-size="24">지금은 필요하지 않아요</text><text x="75" y="570" font-size="30">정리하기</text><text x="75" y="610" font-size="24">계속 쓸 이유가 없어요</text><text x="45" y="710" font-size="26">실행 전, 공식 결제일·조건 확인</text><text x="45" y="765" font-size="21">중단·해지 지원과 환불 조건은 서비스마다 달라요.</text></g></svg>