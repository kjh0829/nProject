<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" role="img" aria-labelledby="title desc"><title id="title">반복하기 쉬운 저녁 고르기</title><desc id="desc">오늘의 기운, 익숙한 메뉴, 다음 한 끼 분량 순서로 생각합니다. 가장 싼 식사보다 지속할 수 있는 식사를 찾는 창작 제안입니다.</desc><rect width="700" height="820" rx="30" fill="#efe7d5"/><g font-family="sans-serif" fill="#203e34"><text x="45" y="65" font-size="22">FIRE 식사 습관 · 03</text><text x="45" y="125" font-size="34" font-weight="bold">피곤한 날에도 고를 수 있는 한 끼</text><g fill="#fffdf6"><rect x="45" y="190" width="610" height="135" rx="22"/><rect x="45" y="355" width="610" height="135" rx="22"/><rect x="45" y="520" width="610" height="135" rx="22"/></g><text x="75" y="245" font-size="30">1. 오늘의 기운 살피기</text><text x="75" y="290" font-size="24">요리와 설거지까지 감당할 수 있나요?</text><text x="75" y="410" font-size="30">2. 익숙한 메뉴 하나 고르기</text><text x="75" y="455" font-size="24">새 재료보다 준비 가능한 범위부터</text><text x="75" y="575" font-size="30">3. 다음 한 끼 분량 생각하기</text><text x="75" y="620" font-size="24">큰 포장도 끝까지 쓸 수 있는지 확인</text><text x="45" y="720" font-size="26">가장 싼 저녁이 유일한 정답은 아니에요.</text><text x="45" y="775" font-size="21">창작 생활 제안 · 조리법이나 식품 안전 판정이 아닙니다.</text></g></svg>