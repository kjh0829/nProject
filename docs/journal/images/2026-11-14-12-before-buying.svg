<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" role="img" aria-labelledby="title desc"><title id="title">물건 하나, 결정 전에 묻기</title><desc id="desc">어떤 순간이 편해지는지, 가진 것으로 가능한지 생각한 뒤 지금 사기, 더 알아보기, 이번에는 넘기기 중 선택합니다.</desc><rect width="700" height="820" rx="30" fill="#e3eae8"/><g font-family="sans-serif" fill="#203e34"><text x="45" y="65" font-size="22">FIRE 소비 선택 · 04</text><text x="45" y="125" font-size="34" font-weight="bold">이것이 있으면 무엇이 편해질까?</text><g fill="#fffdf6"><rect x="45" y="180" width="610" height="115" rx="22"/><rect x="45" y="325" width="610" height="115" rx="22"/><rect x="45" y="485" width="610" height="180" rx="22"/></g><text x="75" y="225" font-size="28">1. 필요한 순간 떠올리기</text><text x="75" y="267" font-size="23">편리함도, 즐거움도 솔직하게</text><text x="75" y="370" font-size="28">2. 가진 것으로 해 보기</text><text x="75" y="412" font-size="23">충분한 점과 부족한 점 알아보기</text><text x="75" y="537" font-size="28">3. 내 상황에 맞게 선택하기</text><text x="75" y="585" font-size="25">지금 사기 · 더 알아보기</text><text x="75" y="632" font-size="25">이번에는 넘기기</text><text x="45" y="730" font-size="25">안 산 물건의 가격이 곧 절약액은 아니에요.</text><text x="45" y="780" font-size="20">창작 생활 제안 · 절약 효과를 실측한 자료가 아닙니다.</text></g></svg>