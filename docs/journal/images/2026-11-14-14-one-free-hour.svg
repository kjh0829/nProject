<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" role="img" aria-labelledby="title desc"><title id="title">빈 한 시간, 내게 필요한 휴식</title><desc id="desc">움직임, 연결, 조용함 중 오늘 필요한 것을 골라 작은 행동 하나를 시작합니다. 한 시간을 모두 채울 필요는 없습니다.</desc><rect width="700" height="820" rx="30" fill="#e7e5ed"/><g font-family="sans-serif" fill="#203e34"><text x="45" y="65" font-size="22">FIRE 시간의 여유 · 05</text><text x="45" y="125" font-size="34" font-weight="bold">오늘은 어떤 쉼이 필요할까요?</text><g fill="#fffdf6"><rect x="45" y="190" width="610" height="135" rx="22"/><rect x="45" y="355" width="610" height="135" rx="22"/><rect x="45" y="520" width="610" height="135" rx="22"/></g><text x="75" y="245" font-size="30">움직임</text><text x="75" y="290" font-size="24">가볍게 몸 풀기 · 익숙한 길 걷기</text><text x="75" y="410" font-size="30">연결</text><text x="75" y="455" font-size="24">안부 묻기 · 서로 편한 시간에 통화</text><text x="75" y="575" font-size="30">조용함</text><text x="75" y="620" font-size="24">알림 잠시 끄기 · 편한 자리에 앉기</text><text x="45" y="725" font-size="26">하나만 시작하고, 맞지 않으면 멈춰도 돼요.</text><text x="45" y="780" font-size="21">창작 생활 제안 · 휴식 효과를 검증한 자료가 아닙니다.</text></g></svg>