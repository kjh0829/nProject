<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" role="img" aria-labelledby="title desc"><title id="title">가벼운 약속, 함께 고르기</title><desc id="desc">시간과 비용, 준비 부담을 함께 이야기하고 산책, 대화, 통화 중 서로 편한 방식을 고릅니다.</desc><rect width="700" height="820" rx="30" fill="#eee5dc"/><g font-family="sans-serif" fill="#203e34"><text x="45" y="65" font-size="22">FIRE 관계와 여가 · 06</text><text x="45" y="125" font-size="34" font-weight="bold">서로 편한 약속을 골라 볼까요?</text><g fill="#fffdf6"><rect x="45" y="190" width="610" height="135" rx="22"/><rect x="45" y="355" width="610" height="135" rx="22"/><rect x="45" y="520" width="610" height="135" rx="22"/></g><text x="75" y="245" font-size="30">시간</text><text x="75" y="290" font-size="24">얼마나, 언제 만나는 게 편한가요?</text><text x="75" y="410" font-size="30">비용</text><text x="75" y="455" font-size="24">식사부터 할까요, 가볍게 만날까요?</text><text x="75" y="575" font-size="30">준비 부담</text><text x="75" y="620" font-size="24">이동·준비·정리는 누구에게 생기나요?</text><text x="45" y="725" font-size="25">산책 · 편한 공간의 대화 · 통화 중 함께 선택</text><text x="45" y="780" font-size="21">창작 생활 제안 · 장소와 상황에 따라 비용이 듭니다.</text></g></svg>